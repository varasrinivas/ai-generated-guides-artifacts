# examples/github-actions/boot4-drift.yml
# Runs in a SERVICE repo, after its migration has landed. Weekly re-audit for
# the Tier-3 changes that compile, start, and still behave differently.
# The tool grant is read-only: it reports, and structurally cannot fix.
name: Boot 4 drift check
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      # --allow-tool=read and nothing else: no write, no shell. A drift
      # check that could edit the repo would be a migration nobody asked for.
      - name: Audit for Tier-3 drift
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          copilot -p "Using .github/skills/boot4-migration/references/gotchas.md
          and references/boot4-notes.md, audit this repository for Tier-3
          regressions only: Jackson serialization defaults, Security 7
          authorization behavior, PropertyMapper null handling, and Batch
          metadata persistence.
          Report findings as a markdown list.
          If you find nothing, say exactly: NO DRIFT FOUND." \
            -s --allow-tool=read --no-ask-user | tee drift.md
          cat drift.md >> "$GITHUB_STEP_SUMMARY"
